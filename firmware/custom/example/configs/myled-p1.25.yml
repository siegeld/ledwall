# Myled's P1.25 module (Chipone ICND1065L, HUB320) on an E320, hung landscape.
# docs/PANELS.md has the module's record; this is the layout that drives it.
#
# Bitstream: PANEL=128x256-icnd1065l-hub320 exp/build-rt.sh   (four outputs)
# Bake it in:
#   PANEL=128x256-icnd1065l-hub320 exp/build-rt.sh \
#     --default-config custom/example/configs/myled-p1.25.yml firmware
#
# NEEDS GATEWARE 3.1.0 OR LATER: this module has a serial bus on HUB320 pins
# 20 and 21, which earlier bitstreams drove (docs/HUB320.md).
#
# The module is 128 wide and 256 tall to the card -- four 128x64 strips
# stacked -- and hangs a quarter turn, so the picture is 256x128.
# One module on J1. Two side by side, J1 the left one, is grid 1x2 with
# J1: 0,1 and J2: 0,0 (turned, the framebuffer's last rows are the left of
# the picture); exp/bench-myled.cfg is that layout.
grid: 1x1
panel_width: 128
panel_height: 256
J1: 0,0
rotate: 90

drive: icnd1065
group_origins: 0,0 0,64 0,128 0,192
clk_div: 4

# The vendor's white balance, from the receiver profile it sent with the
# modules (tools/rcvbp_import.py writes these lines from a .rcvbp). Each is
# register, then red, green and blue. Registers 0x02-0x04 are left out on
# purpose: they set the scan and grey range the output stage is built around.
chip_reg: 0x07 0x10
chip_reg: 0x0c 0x01 0x0e 0x0e
chip_reg: 0x0d 0x01 0x05 0x03
chip_reg: 0x0f 0x01 0x01 0x11
chip_reg: 0x19 0x07 0x08 0x0b
chip_reg: 0x1c 0x25 0x3d 0x26
chip_reg: 0x1d 0x86 0xc6 0xaa
chip_reg: 0x1e 0xa1 0xb3 0x85
chip_reg: 0x20 0x40 0x40 0x60
chip_reg: 0x23 0x40 0x43 0x40
