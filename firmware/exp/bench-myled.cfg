# The bench card: two Myled P1.25 modules hung landscape side by side, J1 the
# left one, baked into its firmware because no boot server reaches it.
# The framebuffer is 128x512; turned 90 degrees it is 512x128, and its last
# rows are the left of the picture, so J1 sits at grid row 1.
# docs/RUNTIME-GEOMETRY.md, docs/PANELS.md.
grid: 1x2
panel_width: 128
panel_height: 256
drive: icnd1065
group_origins: 0,0 0,64 0,128 0,192
J1: 0,1
J2: 0,0
rotate: 90
clk_div: 4
# The vendor profile's per-colour registers (factory/myled-*.rcvbp), without
# 0x02-0x04: those set the scan and grey range our stage was locked with.
chip_reg: 0x07 0x10
chip_reg: 0x0c 0x01 0x0e 0x0e
chip_reg: 0x0d 0x01 0x05 0x03
chip_reg: 0x0f 0x01 0x01 0x11
chip_reg: 0x19 0x07 0x08 0x0b
chip_reg: 0x1c 0x25 0x3d 0x26
chip_reg: 0x1d 0x86 0xc6 0xaa
chip_reg: 0x1e 0xa1 0xb3 0x85
chip_reg: 0x20 0x40 0x40 0x60
chip_reg: 0x23 0x40 0x43 0x40
