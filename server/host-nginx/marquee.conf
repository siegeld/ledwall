# Same-origin proxy so Marquee serves at https://<host>/marquee/ with one build.
# The frontend is path-agnostic (Vite base './' + runtime mount detection), so
# the prefix is stripped and nothing is baked in.

# Bare /marquee must redirect, not fall through. On a host whose catch-all
# `location /` belongs to another app -- ours serves a different dashboard
# there -- an un-redirected /marquee silently lands in THAT app rather than
# 404ing, which looks like Marquee is broken when it is simply never reached.
location = /marquee { return 301 /marquee/; }
location /marquee/ {
    proxy_pass http://127.0.0.1:8411/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /marquee/api/    { proxy_pass http://127.0.0.1:8410/api/; }
location /marquee/auth/   { proxy_pass http://127.0.0.1:8410/auth/; }
location /marquee/healthz { proxy_pass http://127.0.0.1:8410/healthz; }
location /marquee/ws {
    proxy_pass http://127.0.0.1:8410/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
