server {
  listen 3000;
  root /usr/share/nginx/html;

  # Proxy the API from the frontend container itself.
  #
  # Without this, /api/v1/... falls through to the SPA catch-all below and the
  # browser is handed index.html where it expects JSON -- so every list renders
  # empty with no visible error. The dev server and the host edge both proxied
  # these; the container did not, which only shows up when it is reached
  # directly on its published port.
  location /api/    { proxy_pass http://api:8000/api/; proxy_set_header Host $host; }
  location /auth/   { proxy_pass http://api:8000/auth/; proxy_set_header Host $host; }
  location = /healthz { proxy_pass http://api:8000/healthz; }
  location /ws {
    proxy_pass http://api:8000/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Hashed assets are immutable; HTML must never be cached, or a deploy pins a
  # browser to stale JS chunks.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location = /index.html { add_header Cache-Control "no-cache, must-revalidate"; }

  # SPA fallback: any unknown path renders the app, which then routes.
  location / { try_files $uri $uri/ /index.html; }
}
