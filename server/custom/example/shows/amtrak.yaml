# name: amtrak
# description: Amtrak Northeast Corridor board, New York Penn to Boston
#
# THE SAME THREE SCENES as metro-north.yaml and lirr.yaml, at the same column
# widths, over a completely different upstream -- Amtrak publishes no GTFS
# feed, so its provider reads a JSON API instead. That the board is unchanged
# is the point: the provider absorbs the difference and publishes the same
# shape, so a show is portable across systems that share nothing underneath.
#
# One field differs. The other boards show a DESTINATION; here every departure
# goes to Boston, so the column shows the SERVICE instead -- Acela or Regional
# is the choice a corridor passenger is actually making. The provider publishes
# `service` as a short name for exactly this reason: "Northeast Regional" is
# 98px of a 128px wall, which is three quarters of the width for a phrase every
# row repeats.
#
# The feed also carries `platform`, `late`, `scheduled` and the full `route`,
# and this board draws none of them. 128px has room for three columns and the
# shipped board spends them on the three things a passenger reads first. Swap
# one in by changing a `field:` -- which is the point of the `rows` layer.
#
# `platform` in particular is usually BLANK and that is correct: Amtrak assigns
# a track at the last minute, so a real board shows one for the train that is
# boarding and nothing for the ones behind it.
#
# Three scenes that page like a real station board, because 128px of height will
# not hold departures, arrivals and running trains at a legible size.
#
# Every value comes from the `metro-north` data provider via the `rows` layer
# and {data:...}; the render path makes no network call. See doc/providers.md.
#
# ROW COUNT COMES FROM THE FEED. Six trains draw six rows, three draw three,
# and the rest of the box stays dark. An earlier version of this file spelled
# every row out as three text layers with the index baked into the path -- 18
# layers a scene, 54 in the file -- which meant a quiet hour rendered a column
# of no-value glyphs that looked like data, and moving a column by 2px was
# eighteen separate edits.
#
# COLUMN WIDTHS ARE MEASURED, NOT GUESSED. The house font is DejaVu Sans BOLD,
# which is far wider than it looks in an editor: at size 9 "13:42" is 29px of
# the 128 available, so the time column is 33 and not the 30 that looked
# generous. Laying this out by eye produced a board reading "13:4:". Measure
# before you move one:
#
#     docker compose exec -T api python -c "import sys; sys.path.insert(0,'/app'); \
#       from marquee_core.render import _load_font; print(_load_font(9).getbbox('13:42'))"
#
# `scroll: auto` on the destination is load-bearing: it leaves "Southeast"
# still and scrolls "North White Plains", so the column is sized for the common
# case rather than for the longest name on the line.
#
# Amtrak station names run long -- "Richmond Staples Mill Road" is 141px -- so
# the on-the-line column scrolls more here than on the commuter boards. That is
# the feed, not the layout.
#
# `col_gap: 3`, not 1. A scrolling cell fills its whole width by definition,
# so at a 1px gap the tail of a scrolling station name sits hard against the
# time beside it and the two read as one word. The gap is what keeps a
# scrolling column separate from a static one.
#
# The countdown column is the provider's `countdown` field, which reads "Now",
# "7m" or "" -- blank beyond an hour. That belongs to the provider because the
# scene language has no conditionals, by design.
display: {width: 128, height: 128, fps: 10, format: rgb}
transition: {type: crossfade, duration: 0.4s}

scenes:
  - name: departures
    duration: 12s
    layers:
      - {type: solid, color: "#05070d", box: [0, 0, 128, 128]}
      - {type: gradient, start: "#12233d", end: "#05070d", box: [0, 0, 128, 15], angle: v}
      - {type: text, text: "TO BOSTON", box: [2, 2, 93, 12], size: 10, color: "#C9A84C"}
      - {type: text, text: "{clock:%H:%M}", box: [97, 3, 29, 11], size: 9, align: right, color: "#8899aa"}

      - type: rows
        data: "amtrak.nyp-bos|departures"
        box: [1, 17, 126, 90]
        row_height: 15
        size: 9
        col_gap: 3
        columns:
          - {field: time,        w: 31, color: "#e6edf3"}
          - {field: service,     w: 63, color: "#C9A84C", scroll: auto, speed: 16}
          - {field: countdown,   w: 26, color: "#8899aa", align: right}

      - {type: text, text: "New York Penn", box: [2, 111, 124, 13], size: 9, align: center, color: "#55657a"}

  - name: arrivals
    duration: 12s
    layers:
      - {type: solid, color: "#05070d", box: [0, 0, 128, 128]}
      - {type: gradient, start: "#12233d", end: "#05070d", box: [0, 0, 128, 15], angle: v}
      - {type: text, text: "FROM BOSTON", box: [2, 2, 93, 12], size: 10, color: "#C9A84C"}
      - {type: text, text: "{clock:%H:%M}", box: [97, 3, 29, 11], size: 9, align: right, color: "#8899aa"}

      - type: rows
        data: "amtrak.nyp-bos|arrivals"
        box: [1, 17, 126, 90]
        row_height: 15
        size: 9
        col_gap: 3
        columns:
          - {field: time,      w: 31, color: "#e6edf3"}
          - {field: service,   w: 63, color: "#C9A84C", scroll: auto, speed: 16}
          - {field: countdown, w: 26, color: "#8899aa", align: right}

      - {type: text, text: "into New York Penn", box: [2, 111, 124, 13], size: 9, align: center, color: "#55657a"}

  - name: on-the-line
    duration: 12s
    layers:
      - {type: solid, color: "#05070d", box: [0, 0, 128, 128]}
      - {type: gradient, start: "#12233d", end: "#05070d", box: [0, 0, 128, 15], angle: v}
      - {type: text, text: "ON THE LINE", box: [2, 2, 93, 12], size: 10, color: "#C9A84C"}
      - {type: text, text: "{clock:%H:%M}", box: [97, 3, 29, 11], size: 9, align: right, color: "#8899aa"}

      # Every train already running, its next station, and when it gets there.
      - type: rows
        data: "amtrak.nyp-bos|trains"
        box: [1, 17, 126, 90]
        row_height: 15
        size: 9
        col_gap: 3
        columns:
          # This board KEEPS the train number where the commuter boards drop it.
          # On the Harlem line every train is on one line, so a bare station
          # name is unambiguous and the 24px buys a calmer board. The Northeast
          # Corridor runs Boston to Washington, so a row reading "Trenton
          # 13:47" could belong to any of a dozen trains -- the number is what
          # makes it mean something. Amtrak station names are long enough that
          # this column scrolls either way, so it costs little here.
          - {field: train,     w: 24, size: 8, color: "#8899aa"}
          - {field: next_stop, w: 67, color: "#e6edf3", scroll: auto, speed: 16}
          - {field: next_time, w: 29, color: "#C9A84C", align: right}

      - {type: text, text: "Northeast Corridor", box: [2, 111, 124, 13], size: 9, align: center, color: "#55657a"}
