        box: [1, 17, 126, 90]
        row_height: 15
        size: 9
        col_gap: 3
        columns:
          - {field: time,  w: 31, color: "#e6edf3"}
          - {field: from, w: 63, color: "#C9A84C", scroll: auto, speed: 16}
          - {field: countdown, w: 26, color: "#8899aa", align: right}

      - {type: text, text: "Arrivals", box: [2, 112, 57, 12], size: 8, color: "#55657a"}
      - {type: text, text: "Grand Central", box: [63, 112, 63, 12], size: 8, align: right, color: "#55657a"}

  - name: mnr-on-the-line
