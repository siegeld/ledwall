# name: rail-rotation
# description: All three rail boards in one rotation - Metro-North, LIRR, Amtrak
#
# Nine scenes, ten seconds each: a 90-second cycle giving each railroad half a
# minute. Composed from the three single-system boards in this directory, which
# stay useful on their own; this is what a wall shows when it has no particular
# allegiance.
#
# TWO THINGS CHANGE when a board joins a rotation, and both are the same
# problem -- a viewer arriving mid-cycle has no idea which railroad they are
# looking at:
#
#   * the HEADER names the SYSTEM, not the scene. On its own board "DEPARTURES"
#     is unambiguous; here it could be any of three. "METRO-NORTH" is 83px of
#     the 93px header at size 10, "LIRR" 26 and "AMTRAK" 49 -- measured, and the
#     reason the header is not "MNR DEPARTURES", which is 103px and clips.
#   * the SCENE TYPE moves to the footer, left, with the station on the right.
#
# Everything else -- the rows layers, the column widths, the scroll settings --
# is unchanged from the single-system boards. See doc/providers.md.
display: {width: 128, height: 128, fps: 10, format: rgb}
transition: {type: crossfade, duration: 0.4s}

scenes:

  - name: mnr-departures
    duration: 10s
    layers:
      - {type: solid, color: "#05070d", box: [0, 0, 128, 128]}
      - {type: gradient, start: "#12233d", end: "#05070d", box: [0, 0, 128, 15], angle: v}
      - {type: text, text: "METRO-NORTH", box: [2, 2, 93, 12], size: 10, color: "#C9A84C"}
      - {type: text, text: "{clock:%H:%M}", box: [97, 3, 29, 11], size: 9, align: right, color: "#8899aa"}

      - type: rows
        data: "mnr.harlem|departures"
        box: [1, 17, 126, 90]
        row_height: 15
        size: 9
        col_gap: 3
        columns:
          - {field: time,  w: 31, color: "#e6edf3"}
          - {field: destination, w: 63, color: "#C9A84C", scroll: auto, speed: 16}
          - {field: countdown, w: 26, color: "#8899aa", align: right}

      - {type: text, text: "Departures", box: [2, 112, 57, 12], size: 8, color: "#55657a"}
      - {type: text, text: "Grand Central", box: [63, 112, 63, 12], size: 8, align: right, color: "#55657a"}

  - name: mnr-arrivals
    duration: 10s
    layers:
      - {type: solid, color: "#05070d", box: [0, 0, 128, 128]}
